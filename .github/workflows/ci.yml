# CI/CD for Safelink.
# Runs backend tests/lint and frontend tests/lint/typecheck on every push
# to main and every pull request. On main, Docker images are built, pushed to GHCR,
# and deployed to Coolify.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/mouadlotfi/safelink
  BACKEND_IMAGE: ghcr.io/mouadlotfi/safelink-backend

jobs:
  backend:
    name: Backend tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Lint
        run: uv run ruff check app tests

  frontend:
    name: Frontend tests + lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

  docker-build:
    name: Docker build check (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: frontend
            file: Dockerfile
            scope: frontend
          - target: backend
            file: backend/Dockerfile
            scope: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build ${{ matrix.target }} image (dry run)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.scope }}

  build-images:
    name: Build and push (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: frontend
            image: ghcr.io/mouadlotfi/safelink
            file: Dockerfile
            scope: frontend
            build-args: NEXT_PUBLIC_WEBSITE_URL=${{ vars.WEBSITE_URL }}
          - target: backend
            image: ghcr.io/mouadlotfi/safelink-backend
            file: backend/Dockerfile
            scope: backend
            build-args: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }} image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}
          build-args: ${{ matrix.build-args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-images]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
      url: https://safelink.mouadlotfi.com
    permissions:
      contents: read
      id-token: write
    env:
      COOLIFY_HOST: ${{ vars.COOLIFY_HOST || 'http://100.100.217.81:8000' }}
      APP_UUID: ${{ vars.COOLIFY_APP_UUID || 'pmkq6fpr4hbgv1jworcecwcb' }}
      APP_TAG_VALUE: sha-${{ github.sha }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Connect to Tailscale (WIF)
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.100.217.81

      - name: Verify Coolify connectivity
        run: curl --fail --silent --max-time 10 "${COOLIFY_HOST}"

      - name: Point Coolify APP_TAG at this commit
        run: |
          set -euo pipefail

          # Update both production and preview APP_TAG env vars to the new image tag.
          for PREVIEW in false true; do
            echo "Updating APP_TAG (is_preview=${PREVIEW}) -> ${APP_TAG_VALUE}..."
            HTTP_CODE=$(curl --silent --show-error --write-out "%{http_code}" --output /tmp/coolify_env_resp.json \
              -X PATCH \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"APP_TAG\",\"value\":\"${APP_TAG_VALUE}\",\"is_preview\":${PREVIEW}}" \
              "${COOLIFY_HOST}/api/v1/applications/${APP_UUID}/envs")

            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "::error::Coolify API returned HTTP ${HTTP_CODE} when updating APP_TAG (is_preview=${PREVIEW}):"
              cat /tmp/coolify_env_resp.json || true
              exit 1
            fi
            echo "Successfully updated APP_TAG (is_preview=${PREVIEW})"
          done

      - name: Trigger and verify Coolify deployment
        run: |
          set -euo pipefail

          echo "Triggering Coolify deploy webhook..."
          RESPONSE=$(curl --fail --silent --show-error \
            -X POST "${COOLIFY_WEBHOOK}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}")

          DEPLOYMENT_UUID=$(echo "$RESPONSE" | jq -r '.deployments[0].deployment_uuid // empty')

          if [ -z "${DEPLOYMENT_UUID:-}" ] || [ "${DEPLOYMENT_UUID}" = "null" ]; then
            echo "::error::Could not extract deployment_uuid from Coolify response:"
            echo "$RESPONSE" | jq . 2>/dev/null || echo "$RESPONSE"
            exit 1
          fi

          echo "Coolify deployment queued with UUID: ${DEPLOYMENT_UUID}"

          TIMEOUT_SECONDS=600
          POLL_INTERVAL=2
          ELAPSED=0

          echo "Waiting for deployment to complete (timeout: ${TIMEOUT_SECONDS}s)..."

          while true; do
            DEPLOY_INFO=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${COOLIFY_HOST}/api/v1/deployments/${DEPLOYMENT_UUID}")

            STATUS=$(echo "$DEPLOY_INFO" | jq -r '.status // empty' | tr '[:upper:]' '[:lower:]')

            echo "Deployment status: ${STATUS:-unknown} (${ELAPSED}s elapsed)"

            case "$STATUS" in
              finished)
                echo "Coolify deployment ${DEPLOYMENT_UUID} finished successfully."
                exit 0
                ;;
              failed|cancelled|canceled)
                echo "::error::Coolify deployment ${DEPLOYMENT_UUID} ended with status: ${STATUS}"
                echo "=== Deployment Details ==="
                echo "$DEPLOY_INFO" | jq '{status: .status, commit: .commit, current_stage: .current_stage, error: .error, logs: .logs}' 2>/dev/null || echo "$DEPLOY_INFO"
                exit 1
                ;;
              queued|in_progress|"")
                # Deployment is still running
                ;;
              *)
                echo "::warning::Unrecognized status '${STATUS}', continuing to poll..."
                ;;
            esac

            if [ "$ELAPSED" -ge "$TIMEOUT_SECONDS" ]; then
              echo "::error::Timed out after ${TIMEOUT_SECONDS}s waiting for deployment ${DEPLOYMENT_UUID}"
              echo "Last status: ${STATUS:-unknown}"
              echo "$DEPLOY_INFO" | jq . 2>/dev/null || echo "$DEPLOY_INFO"
              exit 1
            fi

            sleep "$POLL_INTERVAL"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done
