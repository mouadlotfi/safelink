# CI/CD for Safelink.
# Runs backend tests/lint and frontend tests/lint/typecheck on every push
# to main and every pull request. On main, Docker images are built, pushed to GHCR,
# and deployed to Coolify.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/mouadlotfi/safelink
  BACKEND_IMAGE: ghcr.io/mouadlotfi/safelink-backend

jobs:
  backend:
    name: Backend tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Lint
        run: uv run ruff check app tests

  frontend:
    name: Frontend tests + lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
      url: https://safelink.mouadlotfi.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          build-args: NEXT_PUBLIC_WEBSITE_URL=${{ vars.WEBSITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Tailscale (WIF)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.100.217.81

      - name: Verify Coolify connectivity
        run: curl --fail --silent --max-time 10 http://100.100.217.81:8000

      - name: Point Coolify APP_TAG at this commit
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_HOST: http://100.100.217.81:8000
          APP_UUID: pmkq6fpr4hbgv1jworcecwcb
          APP_TAG_VALUE: sha-${{ github.sha }}
        run: |
          set -euo pipefail

          # Update both production and preview APP_TAG env vars to the new image tag.
          for PREVIEW in false true; do
            echo "Updating APP_TAG (is_preview=${PREVIEW}) -> ${APP_TAG_VALUE}..."
            HTTP_CODE=$(curl --silent --show-error --write-out "%{http_code}" --output /tmp/coolify_env_resp.json \
              -X PATCH \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"APP_TAG\",\"value\":\"${APP_TAG_VALUE}\",\"is_preview\":${PREVIEW}}" \
              "${COOLIFY_HOST}/api/v1/applications/${APP_UUID}/envs")

            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "::error::Coolify API returned HTTP ${HTTP_CODE} when updating APP_TAG (is_preview=${PREVIEW}):"
              cat /tmp/coolify_env_resp.json || true
              exit 1
            fi
            echo " Successfully updated APP_TAG (is_preview=${PREVIEW})"
          done

      - name: Trigger and verify Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_HOST: http://100.100.217.81:8000
        run: |
          set -euo pipefail

          echo "Triggering Coolify deploy webhook..."
          RESPONSE=$(curl --fail --silent --show-error \
            -X POST "${COOLIFY_WEBHOOK}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}")

          DEPLOYMENT_UUID=$(echo "$RESPONSE" | jq -r '.deployments[0].deployment_uuid // empty')

          if [ -z "${DEPLOYMENT_UUID:-}" ] || [ "${DEPLOYMENT_UUID}" = "null" ]; then
            echo "::error::Could not extract deployment_uuid from Coolify response:"
            echo "$RESPONSE" | jq . 2>/dev/null || echo "$RESPONSE"
            exit 1
          fi

          echo "Coolify deployment queued with UUID: ${DEPLOYMENT_UUID}"

          TIMEOUT_SECONDS=600
          POLL_INTERVAL=5
          ELAPSED=0

          echo "Waiting for deployment to complete (timeout: ${TIMEOUT_SECONDS}s)..."

          while true; do
            DEPLOY_INFO=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${COOLIFY_HOST}/api/v1/deployments/${DEPLOYMENT_UUID}")

            STATUS=$(echo "$DEPLOY_INFO" | jq -r '.status // empty' | tr '[:upper:]' '[:lower:]')

            echo "Deployment status: ${STATUS:-unknown} (${ELAPSED}s elapsed)"

            case "$STATUS" in
              finished)
                echo "Coolify deployment ${DEPLOYMENT_UUID} finished successfully."
                exit 0
                ;;
              failed|cancelled|canceled)
                echo "::error::Coolify deployment ${DEPLOYMENT_UUID} ended with status: ${STATUS}"
                echo "=== Deployment Details ==="
                echo "$DEPLOY_INFO" | jq '{status: .status, commit: .commit, current_stage: .current_stage, error: .error, logs: .logs}' 2>/dev/null || echo "$DEPLOY_INFO"
                exit 1
                ;;
              queued|in_progress|"")
                # Deployment is still running
                ;;
              *)
                echo "::warning::Unrecognized status '${STATUS}', continuing to poll..."
                ;;
            esac

            if [ "$ELAPSED" -ge "$TIMEOUT_SECONDS" ]; then
              echo "::error::Timed out after ${TIMEOUT_SECONDS}s waiting for deployment ${DEPLOYMENT_UUID}"
              echo "Last status: ${STATUS:-unknown}"
              echo "$DEPLOY_INFO" | jq . 2>/dev/null || echo "$DEPLOY_INFO"
              exit 1
            fi

            sleep "$POLL_INTERVAL"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done
