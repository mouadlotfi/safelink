# CI/CD for Safelink.
# Runs backend tests/lint and frontend tests/lint/typecheck on every push
# to main and every pull request. On main, Docker images are built, pushed to GHCR,
# and deployed to the VPS self-hosted runner via Docker Compose.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/mouadlotfi/safelink
  BACKEND_IMAGE: ghcr.io/mouadlotfi/safelink-backend

jobs:
  backend:
    name: Backend tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Lint
        run: uv run ruff check app tests

  frontend:
    name: Frontend tests + lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version-file: package.json

      # Dependabot PRs update package.json but not bun.lock; allow Bun to sync it.
      - name: Install dependencies
        run: bun install ${{ github.actor == 'dependabot[bot]' && '' || '--frozen-lockfile' }}

      - name: Run tests
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

  build-images:
    name: Build and push (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: frontend
            image: ghcr.io/mouadlotfi/safelink
            file: Dockerfile
            scope: frontend
            build-args: NEXT_PUBLIC_WEBSITE_URL=${{ vars.NEXT_PUBLIC_WEBSITE_URL || vars.WEBSITE_URL || 'http://localhost:3044' }}
          - target: backend
            image: ghcr.io/mouadlotfi/safelink-backend
            file: backend/Dockerfile
            scope: backend
            build-args: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }} image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}
            ${{ matrix.image }}:latest
          build-args: ${{ matrix.build-args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  deploy:
    name: Deploy
    runs-on: [self-hosted, Linux, X64, safelink]
    timeout-minutes: 10
    needs: [build-images]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_WEBSITE_URL || vars.WEBSITE_URL || 'http://localhost:3044' }}
    permissions:
      contents: read
      packages: read
    env:
      APP_TAG: sha-${{ github.sha }}
      PORT: ${{ vars.PORT || '3044' }}
      NEXT_PUBLIC_WEBSITE_URL: ${{ vars.NEXT_PUBLIC_WEBSITE_URL || vars.WEBSITE_URL || 'http://localhost:3044' }}
      API_KEYS: ${{ secrets.API_KEYS || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy and verify with Docker Compose
        run: |
          set -euo pipefail

          PROJECT_NAME="safelink"
          TARGET_TAG="${APP_TAG}"
          HEALTH_TIMEOUT=60
          POLL_INTERVAL=3
          HTTP_PORT="${PORT##*:}"

          PREV_CID=$(docker compose -p "${PROJECT_NAME}" ps -q safelink 2>/dev/null || true)
          PREV_TAG=""
          if [ -n "${PREV_CID}" ]; then
            PREV_IMAGE=$(docker inspect --format '{{.Config.Image}}' "${PREV_CID}" 2>/dev/null || true)
            PREV_TAG="${PREV_IMAGE##*:}"
          fi

          echo "Pulling images for tag ${TARGET_TAG}..."
          if ! APP_TAG="${TARGET_TAG}" docker compose -p "${PROJECT_NAME}" pull; then
            echo "::error::Failed to pull images for tag ${TARGET_TAG}"
            exit 1
          fi

          echo "Updating containers..."
          APP_TAG="${TARGET_TAG}" docker compose -p "${PROJECT_NAME}" up -d --remove-orphans

          echo "Waiting for services to become healthy..."
          START_TIME=$(date +%s)
          DEPLOY_OK=false

          while true; do
            ELAPSED=$(( $(date +%s) - START_TIME ))

            BACKEND_CID=$(docker compose -p "${PROJECT_NAME}" ps -q backend 2>/dev/null || true)
            FRONTEND_CID=$(docker compose -p "${PROJECT_NAME}" ps -q safelink 2>/dev/null || true)

            BACKEND_HEALTH="starting"
            FRONTEND_HEALTH="starting"

            if [ -n "${BACKEND_CID}" ]; then
              BACKEND_HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${BACKEND_CID}" 2>/dev/null || echo "error")
            fi

            if [ -n "${FRONTEND_CID}" ]; then
              FRONTEND_HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${FRONTEND_CID}" 2>/dev/null || echo "error")
            fi

            echo "Status (${ELAPSED}s): backend=${BACKEND_HEALTH}, frontend=${FRONTEND_HEALTH}"

            if [ "${BACKEND_HEALTH}" = "unhealthy" ] || [ "${FRONTEND_HEALTH}" = "unhealthy" ]; then
              echo "::error::One or more containers reported unhealthy"
              break
            fi

            if [ "${BACKEND_HEALTH}" = "healthy" ] && [ "${FRONTEND_HEALTH}" = "healthy" ]; then
              HTTP_STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 5 "http://127.0.0.1:${HTTP_PORT}/api/stats" 2>/dev/null || true)
              if [ "${HTTP_STATUS}" = "200" ]; then
                echo "Smoke test passed (HTTP 200 from /api/stats)"
                DEPLOY_OK=true
                break
              fi
            fi

            if [ "${ELAPSED}" -ge "${HEALTH_TIMEOUT}" ]; then
              echo "::error::Timed out after ${HEALTH_TIMEOUT}s waiting for containers to become healthy"
              break
            fi

            sleep "${POLL_INTERVAL}"
          done

          if [ "${DEPLOY_OK}" = "true" ]; then
            echo "Deployment finished successfully."
            docker image prune -f >/dev/null 2>&1 || true
            exit 0
          fi

          echo "::error::Deployment failed; fetching recent container logs"
          docker compose -p "${PROJECT_NAME}" logs --tail=50 || true

          if [ -n "${PREV_TAG}" ] && [ "${PREV_TAG}" != "${TARGET_TAG}" ]; then
            echo "::warning::Rolling back to previous tag: ${PREV_TAG}"
            APP_TAG="${PREV_TAG}" docker compose -p "${PROJECT_NAME}" up -d --remove-orphans || {
              echo "::error::Rollback to ${PREV_TAG} failed"
            }
          fi

          exit 1
